<!DOCTYPE html>
<html>
<head><title>Generate ScoutMe Icon</title></head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#050e08';
ctx.fillRect(0, 0, 512, 512);
ctx.strokeStyle = '#00e56b';
ctx.lineWidth = 3;
[200, 160, 120].forEach(r => {
  ctx.globalAlpha = 0.15;
  ctx.beginPath();
  ctx.arc(256, 256, r, 0, Math.PI*2);
  ctx.stroke();
});
ctx.globalAlpha = 1;
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 120px Arial Black';
ctx.textAlign = 'center';
ctx.fillText('S', 240, 290);
ctx.fillStyle = '#00e56b';
ctx.fillText('M', 360, 290);
canvas.toBlob(blob => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'icon-512.png';
  a.click();
});
</script>
</body>
</html>
